name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the app icon
        run: node scripts/make-icon.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the renderer and main bundles
        run: npm run build

      # System audio on Windows comes from Chromium's loopback capture, so no
      # native helper has to be compiled here.
      - name: Package the NSIS installer
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: notebro-windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
